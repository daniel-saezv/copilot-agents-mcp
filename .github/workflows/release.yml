name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check tag version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version $TAG_VERSION differs from package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish with npm trusted publishing
        id: trusted-publish
        continue-on-error: true
        run: npm publish --provenance --access public

      - name: Publish with NPM_TOKEN fallback
        if: steps.trusted-publish.outcome == 'failure' && secrets.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Require npm authentication
        if: steps.trusted-publish.outcome == 'failure' && secrets.NPM_TOKEN == ''
        run: |
          echo "npm trusted publishing failed and NPM_TOKEN is not configured"
          exit 1
