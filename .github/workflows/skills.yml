name: Skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Validate template skills
        run: |
          set -euo pipefail
          for skill in .agents/skills/agent-environment .agents/skills/project-setup; do
            npx --yes skills-ref@0.1.5 validate "$skill"
          done