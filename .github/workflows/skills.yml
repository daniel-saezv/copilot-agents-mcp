name: Skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate template skills
        run: |
          set -euo pipefail
          for skill in .agents/skills/agent-environment .agents/skills/project-setup; do
            pnpm dlx skills-ref@0.1.5 validate "$skill"
          done